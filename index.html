<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueBite - Smart Food Rescue</title>
    <link rel="manifest" href="manifest.json" />
    <style>
        @import url('https://googleapis.com');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 41, 59, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #34d399;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .camera-box {
            height: 200px;
            background: #020617;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: #94a3b8;
            font-size: 14px;
        }
        .btn {
            background: #10b981;
            color: #020617;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .btn-text {
            color: #34d399;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #e2e8f0;
            text-align: left;
        }
        .list-item {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
        }
        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            display: flex;
            justify-content: space-around;
        }
        .nav-item {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #34d399;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="logo-text">RescueBite</div>
            <div class="subtitle">Smart Food Management</div>
        </div>
    </header>

    <main class="app-container">
        <div id="scan-view">
            <div class="card">
                <div class="camera-box" id="camera-status">
                    Camera access required to scan.
                </div>
                <button class="btn" onclick="initializeCamera()">Enable Camera</button>
                <button class="btn-text" onclick="switchView('inventory-view')">Manually Add to Inventory →</button>
            </div>
        </div>

        <div id="inventory-view" style="display: none;">
            <h2 class="section-title">Tracked Food Items</h2>
            <div class="list-item">
                <div>
                    <strong style="font-size: 14px;">Fresh Whole Milk</strong>
                    <div class="subtitle">Expires in 2 days</div>
                </div>
                <span class="badge badge-critical">Critical</span>
            </div>
            <div class="list-item">
                <div>
                    <strong style="font-size: 14px;">White Sandwich Bread</strong>
                    <div class="subtitle">Expires in 4 days</div>
                </div>
                <span class="badge badge-warning">Warning</span>
            </div>
        </div>
    </main>

    <nav>
        <button class="nav-item active" id="btn-scan" onclick="switchView('scan-view')">Scan</button>
        <button class="nav-item" id="btn-inv" onclick="switchView('inventory-view')">Inventory</button>
    </nav>

    <script>
        function switchView(viewId) {
            document.getElementById('scan-view').style.display = viewId === 'scan-view' ? 'block' : 'none';
            document.getElementById('inventory-view').style.display = viewId === 'inventory-view' ? 'block' : 'none';
            
            document.getElementById('btn-scan').classList.toggle('active', viewId === 'scan-view');
            document.getElementById('btn-inv').classList.toggle('active', viewId === 'inventory-view');
        }

        async function initializeCamera() {
            const statusBox = document.getElementById('camera-status');
            statusBox.innerText = "Connecting to device camera...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                statusBox.innerHTML = '<video id="v" autoplay playsinline style="width:100%; height:100%; border-radius:12px; object-fit:cover;"></video>';
                document.getElementById('v').srcObject = stream;
            } catch (err) {
                statusBox.innerText = "Camera initialization blocked. Please confirm permissions.";
            }
        }
    </script>
</body>
</html>
